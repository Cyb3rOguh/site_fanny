name: Deploy React Site to GitHub Pages

on:
  # Déclenche le déploiement uniquement quand on pousse (push) sur la branche main
  push:
    branches:
      - main

  # Permet de lancer le déploiement manuellement depuis l'onglet "Actions" si besoin
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Adaptez si votre projet utilise une version spécifique
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Indiquez ici le dossier de build (généralement 'build' pour CRA, 'dist' pour Vite)
          path: './dist' 
          # Si vous utilisez Vite, changez la ligne ci-dessus par: path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4